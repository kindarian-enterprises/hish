# SBMI Compression Configuration
# Controls which directories to scan, files to exclude, and phrase mappings

# Directories to scan for markdown files to compress
# Paths relative to hish root
scan_directories:
  - "templates"
  - "prompts"
  - "local"

# Directories to NEVER scan (excluded entirely)
# These contain user documentation, personas, and behavioral context
excluded_directories:
  - "docs"  # User documentation (human-readable only)
  - "templates/style-and-philosophy"  # Behavioral directives
  - "**/node_modules"
  - "**/.git"

# Files/patterns that should NEVER be compressed (behavioral layer)
exclusion_patterns:
  # Agent personas
  - "**/dev_agent_persona.md"
  - "**/qa_agent_persona.md"
  - "**/red_team_agent_persona.md"

  # Initialization prompts
  - "**/dev_agent_init_prompt.md"
  - "**/qa_agent_init_prompt.md"
  - "**/red_team_agent_init_prompt.md"

  # Session end prompts
  - "**/dev_agent_session_end_prompt.md"
  - "**/qa_agent_session_end_prompt.md"
  - "**/red_team_agent_session_end_prompt.md"

  # Workflow guides
  - "**/dev_agent_workflow_guide.md"
  - "**/dev_agent_troubleshooting.md"
  - "**/qa_agent_todo_checklist.md"
  - "**/red_team_report_template.md"

  # Context and philosophy
  - "**/dev_agent_framework_context.md"
  - "**/dev_agent_context.md"
  - "**/style-and-philosophy/**"
  - "**/workflows-and-processes/**"

  # Exclusion rules itself (meta)
  - "**/compression-exclusion-rules.md"

# Phrase compression mappings for Level 2 compression
# Format: "original phrase": "abbreviated form"
# Generated by: make sbmi-analyze (empirically optimized)
# Total potential savings: ~8,725 chars across framework docs
phrase_mappings:
  # HIGH-IMPACT multi-word phrases (sorted by impact: frequency × savings)
  "cross-project intelligence": "xproj-intel"  # 35x, save 770 chars
  "search patterns": "srch-pat"  # 55x, save 605 chars
  "framework documentation": "fw-docs"  # 25x, save 475 chars
  "cross-project applicability": "xproj-apply"  # 19x, save 437 chars
  "key sections": "key-sec"  # 51x, save 408 chars
  "project contexts": "proj-ctx"  # 30x, save 360 chars
  "project context": "proj-ctx"  # 29x, save 319 chars
  "semantic search": "sem-srch"  # 27x, save 297 chars
  "intelligence collection": "intel-coll"  # 15x, save 285 chars
  "session end protocol": "end-proto"  # 19x, save 285 chars
  "pattern recognition": "pat-recog"  # 18x, save 270 chars
  "across projects": "x-proj"  # 24x, save 264 chars
  "red team": "rt"  # 65x, save 260 chars
  "key sections lines": "key-sec-ln"  # 20x, save 260 chars
  "agent initialization": "agent-init"  # 16x, save 256 chars
  "project documentation": "proj-docs"  # 15x, save 255 chars
  "red team agent": "rt-agent"  # 28x, save 252 chars
  "cross-project learning": "xproj-learn"  # 13x, save 234 chars
  "mcp server configuration": "mcp-cfg"  # 12x, save 228 chars
  "improvement opportunities": "improve-ops"  # 10x, save 210 chars
  "architectural decisions": "arch-dec"  # 11x, save 209 chars
  "initialization protocol": "init-proto"  # 11x, save 209 chars
  "quality standards": "qual-std"  # 16x, save 208 chars
  "knowledge base": "kb"  # 20x, save 200 chars
  "sections lines": "sec-ln"  # 20x, save 200 chars
  "implementation details": "impl-det"  # 11x, save 198 chars
  "repository indexing": "repo-idx"  # 13x, save 195 chars
  "wyoming protocol": "wy-proto"  # 16x, save 192 chars
  "server configuration": "srv-cfg"  # 12x, save 192 chars
  "red team analysis": "rt-analysis"  # 16x, save 192 chars

  # Additional high-frequency terms
  "cross-project": "xproj"  # Base term
  "framework": "fw"
  "documentation": "docs"
  "configuration": "cfg"
  "intelligence": "intel"
  "collection": "coll"
  "repository": "repo"
  "workflows": "wf"
  "processes": "proc"
  "indexes": "idx"
  "contexts": "ctx"

  # Common commands (preserve specificity)
  "make new-context": "mk newctx"
  "new-context": "newctx"

  # File extensions (preserve)
  ".compact": ".compact"

# Compression strategy selection
# Available strategies: structural, phrase, combined
default_strategy: "combined"

# Compression levels
levels:
  level1:
    name: "Structural Only"
    strategies: ["structural"]
    target_reduction: "40-60%"

  level2:
    name: "Structural + Phrase"
    strategies: ["structural", "phrase"]
    target_reduction: "70-80%"
