name: SBMI Compiler Tests

on:
  push:
    branches: [ main, develop, feature/sbmi-* ]
    paths:
      - 'sbmi/**'
      - 'config/sbmi-compression.yaml'
      - 'scripts/compile-indexes.py'
      - '.github/workflows/test-sbmi.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'sbmi/**'
      - 'config/sbmi-compression.yaml'
      - 'scripts/compile-indexes.py'
      - '.github/workflows/test-sbmi.yml'

jobs:
  test-sbmi:
    name: Test SBMI Compiler
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sbmi-${{ hashFiles('sbmi/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-sbmi-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: make install-deps-sbmi

      - name: Run SBMI tests
        run: make test-sbmi-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./sbmi/coverage.xml
          flags: sbmi
          name: sbmi-${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Compile workflow indexes (CI)
        run: make sbmi-compile-ci

      - name: Verify compiled files
        run: make sbmi-verify

  lint-sbmi:
    name: Lint SBMI Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: make install-deps-sbmi-lint

      - name: Lint SBMI code
        run: LINT_FORMAT=github make lint-sbmi
